[package]
name = "tc_binpoly"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Binary-polynomial arithmetic over GF(2^n) for cryptography: products, squares and inverses modulo a trinomial or pentanomial, constant time with PCLMULQDQ."
readme = "README.md"
documentation = "https://docs.rs/tc_binpoly"
keywords = ["gf2", "binary-field", "polynomial", "cryptography", "no-std"]
categories = ["cryptography", "mathematics", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]

[dependencies]
tc_constant_time = "0.1.0"
tc_zeroize = "0.1.0"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "field"
harness = false
