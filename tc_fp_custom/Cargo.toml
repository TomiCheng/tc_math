[package]
name = "tc_fp_custom"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The SEC and SM2 prime elliptic curves with per-field specialized arithmetic, after Bouncy Castle's custom curves."
readme = "README.md"
documentation = "https://docs.rs/tc_fp_custom"
keywords = ["elliptic-curve", "p256", "secp256k1", "cryptography", "no-std"]
categories = ["cryptography", "mathematics", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# secp128r1, secp160k1, secp160r1 and secp160r2: weak, for interoperability only.
small-curves = []

[dependencies]
tc_bigint = { version = "0.1.0", path = "../tc_bigint", features = ["alloc"] }
tc_constant_time = "0.1.0"
tc_ec_core = { version = "0.1.0", path = "../tc_ec_core" }
tc_zeroize = "0.1.0"

[dev-dependencies]
criterion = "0.8.2"
tc_fp_curve = { version = "0.1.0", path = "../tc_fp_curve" }

[[bench]]
name = "compare"
harness = false
