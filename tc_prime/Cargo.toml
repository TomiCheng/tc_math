[package]
name = "tc_prime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Primality testing and prime generation for cryptography over the integers of tc_bigint: trial division, Miller-Rabin and Shawe-Taylor provable primes."
readme = "README.md"
documentation = "https://docs.rs/tc_prime"
keywords = ["prime", "miller-rabin", "primality", "cryptography", "no-std"]
categories = ["cryptography", "mathematics", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["tc_bigint/alloc", "tc_modular/alloc"]
shawe-taylor = ["dep:tc_digest", "alloc"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
tc_bigint = { version = "0.1.0", path = "../tc_bigint", features = ["rand_core"] }
tc_modular = { version = "0.1.0", path = "../tc_modular" }
tc_digest = { version = "0.1.0", optional = true }

[dev-dependencies]
tc_sha = "0.1.1"
