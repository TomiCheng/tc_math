[package]
name = "tc_f2m_custom"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The SEC binary elliptic curves with per-field specialized arithmetic, after Bouncy Castle's custom curves."
readme = "README.md"
documentation = "https://docs.rs/tc_f2m_custom"
keywords = ["elliptic-curve", "koblitz", "binary-field", "cryptography", "no-std"]
categories = ["cryptography", "mathematics", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# sect113r1, sect113r2, sect131r1 and sect131r2: weak, for interoperability only.
small-curves = []

[dependencies]
tc_bigint = { version = "0.1.0", path = "../tc_bigint", features = ["alloc"] }
tc_constant_time = "0.1.0"
tc_ec_core = { version = "0.1.0", path = "../tc_ec_core" }
tc_zeroize = "0.1.0"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion = "0.8.2"
tc_binpoly = { version = "0.1.0", path = "../tc_binpoly", features = ["alloc"] }
tc_f2m_curve = { version = "0.1.0", path = "../tc_f2m_curve", features = ["small-curves"] }

[[bench]]
name = "compare"
harness = false
