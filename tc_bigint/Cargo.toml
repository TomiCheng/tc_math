[package]
name = "tc_bigint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fixed-width, padded and arbitrary-precision big integers for cryptography, constant time in the fixed-width and padded forms."
readme = "README.md"
documentation = "https://docs.rs/tc_bigint"
keywords = ["bigint", "integer", "constant-time", "cryptography", "no-std"]
categories = ["cryptography", "mathematics", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]
rand_core = ["dep:rand_core"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
tc_constant_time = "0.1.0"
tc_zeroize = "0.1.0"
rand_core = { version = "0.10.1", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "arithmetic"
harness = false
required-features = ["alloc"]
