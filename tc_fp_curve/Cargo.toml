[package]
name = "tc_fp_curve"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Prime-field short-Weierstrass elliptic curves for cryptography: constant-time complete formulas, variable-time wNAF and GLV, and the SEC named curves."
readme = "README.md"
documentation = "https://docs.rs/tc_fp_curve"
keywords = ["elliptic-curve", "ecc", "secp256k1", "cryptography", "no-std"]
categories = ["cryptography", "mathematics", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# secp112r1, secp112r2 and secp128r2: weak, for interoperability only.
small-curves = []

[dependencies]
tc_bigint = { version = "0.1.0", path = "../tc_bigint", features = ["alloc"] }
tc_constant_time = "0.1.0"
tc_ec_core = { version = "0.1.0", path = "../tc_ec_core" }
tc_modular = { version = "0.1.0", path = "../tc_modular", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "ct_var"
harness = false
